[project]
name = "ligue1lab"
version = "0.1.0"
description = "Ligue 1 Lab : le marché des paris sportifs est-il battable ?"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E731",  # lambdas nommées tolérées dans le code d'analyse
    "E741",  # notations mathématiques (P, O, Y) assumées
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

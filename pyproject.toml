[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ligue1lab"
version = "0.2.0"
description = "Ligue 1 Lab : le marché des paris sportifs est-il battable ?"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy", "pandas", "scipy", "scikit-learn", "lightgbm", "shap", "pyarrow",
]

[project.optional-dependencies]
lab = ["streamlit", "plotly"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E731",  # lambdas nommées tolérées dans le code d'analyse
    "E741",  # notations mathématiques (P, O, Y) assumées
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
known-first-party = ["ligue1lab", "test_leakage"]
